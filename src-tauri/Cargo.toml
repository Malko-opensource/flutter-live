[package]
name = "flutter-live"
version = "0.2.3"
description = "Live interpretation for macOS"
authors = ["Malko-opensource"]
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
